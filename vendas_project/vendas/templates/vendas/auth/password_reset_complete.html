{% extends 'vendas/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <i class="bi bi-check-circle-fill fs-2 d-block mb-2"></i>
                    <h4 class="mb-0">Senha redefinida!</h4>
                </div>
                <div class="card-body text-center p-4">
                    <p class="mb-4">Sua senha foi alterada com sucesso. Agora você já pode fazer login com sua nova senha.</p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-success py-2 fw-bold">
                            <i class="bi bi-box-arrow-in-right"></i> Fazer login
                        </a>
                        <a href="{% url 'pagina_inicial' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-house"></i> Voltar para a loja
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
