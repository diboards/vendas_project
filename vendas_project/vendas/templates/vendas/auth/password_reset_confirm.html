{% extends 'vendas/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <i class="bi bi-pencil-square fs-2 d-block mb-2"></i>
                    <h4 class="mb-0">Redefinir Senha</h4>
                    <small>Digite sua nova senha</small>
                </div>
                <div class="card-body p-4">
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nova senha</label>
                                <input type="password" name="new_password1" class="form-control" placeholder="Digite sua nova senha" required>
                                <small class="text-muted">Mínimo 6 caracteres</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Confirmar senha</label>
                                <input type="password" name="new_password2" class="form-control" placeholder="Digite novamente" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">
                                <i class="bi bi-check-circle me-2"></i> Redefinir senha
                            </button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger text-center">
                            <i class="bi bi-exclamation-triangle fs-3 d-block mb-2"></i>
                            <p class="mb-0">O link de recuperação é <strong>inválido</strong> ou <strong>expirou</strong>.</p>
                        </div>
                        <div class="d-grid">
                            <a href="{% url 'password_reset' %}" class="btn btn-primary">
                                <i class="bi bi-arrow-repeat"></i> Solicitar novo link
                            </a>
                        </div>
                    {% endif %}
                    <hr>
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-decoration-none text-muted">
                            <i class="bi bi-arrow-left"></i> Voltar para o login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
