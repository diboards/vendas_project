{% extends 'vendas/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-success text-white text-center py-3">
                    <i class="bi bi-envelope-check fs-2 d-block mb-2"></i>
                    <h4 class="mb-0">E-mail enviado!</h4>
                </div>
                <div class="card-body text-center p-4">
                    <p class="mb-3">
                        Enviamos um link de recuperação para o seu e-mail.
                    </p>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        <small>Verifique também sua caixa de <strong>spam</strong> ou <strong>lixo eletrônico</strong>.</small>
                    </div>
                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Ir para o login
                        </a>
                        <a href="{% url 'pagina_inicial' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-house"></i> Voltar para a loja
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
