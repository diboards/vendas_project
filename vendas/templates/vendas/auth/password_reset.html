{% extends 'vendas/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <i class="bi bi-key fs-2 d-block mb-2"></i>
                    <h4 class="mb-0">Recuperar Senha</h4>
                    <small>Digite seu e-mail para redefinir sua senha</small>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">E-mail cadastrado</label>
                            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-envelope me-2"></i> Enviar link de recuperação
                        </button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-decoration-none text-muted">
                            <i class="bi bi-arrow-left"></i> Voltar para o login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
